<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web2MD · Result</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<header>
  <p class="brand">Web2MD <span>Save the web, as Markdown.</span></p>
  <div class="head-row">
    <h1 id="page-title">Loading conversion result…</h1>
    <span id="scope-chip" class="chip"></span>
  </div>
  <div id="page-url"></div>
  <div id="actions">
    <button id="copy-btn" disabled aria-live="polite">Copy Markdown</button>
    <button id="download-btn" disabled>Download .md</button>
  </div>
</header>
<main>
<section id="report" class="report hidden" aria-label="Content check">
  <div id="summary" class="summary" role="status"></div>
  <p class="note">This checks the extracted content for conversion differences — it does not mean the entire original page was captured.</p>
  <div id="missing"></div>
  <details id="report-details">
    <summary>View check details</summary>
    <table class="checks">
      <caption>Before/after comparison</caption>
      <thead><tr><th scope="col">Check</th><th scope="col">Before</th><th scope="col">After</th><th scope="col">Result</th></tr></thead>
      <tbody id="check-rows"></tbody>
    </table>
  </details>
</section>
<section id="preview" class="hidden" aria-label="Converted content">
  <div class="tabs" role="group" aria-label="Preview mode">
    <button id="tab-rendered" class="tab" aria-pressed="true" aria-controls="rendered">Reading preview</button>
    <button id="tab-raw" class="tab" aria-pressed="false" aria-controls="raw">Markdown source</button>
  </div>
  <div id="rendered" class="content" tabindex="0" aria-label="Reading preview"></div>
  <pre id="raw" class="content hidden" tabindex="0" aria-label="Markdown source"></pre>
</section>
<div id="error-box" class="error-box hidden" role="alert"></div>
</main>
<script src="ui.js"></script>
</body>
</html>
