name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate files
        run: |
          python3 -m json.tool manifest.json >/dev/null
          for file in background.js content.js core/*.js ui/*.js tests/*.js; do
            node --check "$file"
          done

      - name: Run browser tests
        run: |
          timeout 30s google-chrome --headless --no-sandbox --disable-gpu \
            --dump-dom "file://$PWD/tests/run.html" > test-results.html
          grep -q 'ALL PASS' test-results.html

      - name: Verify release package
        if: ${{ hashFiles('store/package.sh') != '' }}
        run: |
          ./store/package.sh >/dev/null
          unzip -t web2md-0.1.0.zip
